<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALGENERAL - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-red: #E10600;
            --glow-red: rgba(225, 6, 0, 0.6);
            --bg-dark: #0a0a0a;
            --card-bg: #151515;
        }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body {
            background: radial-gradient(circle at top, #1a0505, var(--bg-dark));
            color: white;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            color: white;
            text-align: center;
            text-shadow: 0 0 15px var(--glow-red);
            font-weight: 900;
            margin-bottom: 15px;
        }
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
            max-width: 580px;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        label { font-size: 14px; color: #ccc; margin-bottom: 5px; display: block; }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            margin-bottom: 14px;
            outline: none;
            font-size: 15px;
        }
        button {
            background: linear-gradient(45deg, #b30500, var(--main-red));
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover { opacity: 0.92; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .section-title {
            color: #E10600;
            border-bottom: 1px solid #E10600;
            padding-bottom: 10px;
            margin-top: 0;
        }
        #loginScreen { display: flex; flex-direction: column; justify-content: center; min-height: 80vh; }
        .code-item {
            background: #111;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-right: 3px solid var(--main-red);
        }
        .code-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .code-info {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 5px;
        }
        .code-txt { font-weight: bold; color: white; font-size: 15px; word-break: break-all; }
        .copy-mini {
            background: #282828;
            border: 1px solid #555;
            color: #fff;
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 6px;
            width: auto;
            margin: 0;
            flex-shrink: 0;
        }
        .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .actions button { padding: 7px; font-size: 12px; margin: 0; flex: 1; min-width: 70px; }
        .btn-stop { background: #444; }
        .btn-del { background: #800; }
        .btn-time { background: #006600; }
        .btn-renew { background: #b35900; }
        .btn-del-all { background: #600000; border: 1px solid #ff3333; margin-bottom: 14px; }
        .status-active { color: #00ff00; font-weight: bold; }
        .status-banned { color: #ff4444; font-weight: bold; }
        .bulk-box {
            display: none;
            background: #0b0b0b;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--main-red);
            margin-top: 10px;
        }
        .bulk-list {
            max-height: 240px;
            overflow-y: auto;
            background: #141414;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .bulk-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-bottom: 1px solid #222;
            font-size: 13px;
        }
        .bulk-row:last-child { border-bottom: none; }
        .row-2 { display: flex; gap: 10px; }
        .row-2 > div { flex: 1; }
    </style>
</head>
<body>

    <div id="loginScreen" class="card">
        <h2 class="section-title" style="text-align: center;">تسجيل الدخول</h2>
        <label>اسم المستخدم:</label>
        <input type="text" id="username">
        <label>كلمة السر:</label>
        <input type="password" id="password">
        <button onclick="checkLogin()">دخول</button>
    </div>

    <div id="adminPanel" style="display: none;">
        <h1>ALGENERAL ADMIN</h1>

        <div class="card">
            <h3 class="section-title">🛠️ وضع الصيانة والتحديث للتطبيق</h3>
            <label>حالة التطبيق:</label>
            <select id="maintEnabled">
                <option value="false">يعمل طبيعي (مفتوح للمستخدمين)</option>
                <option value="true">متوقف للصيانة / إجبار التحديث</option>
            </select>

            <label>رسالة التحديث / الصيانة المنبثقة:</label>
            <input type="text" id="maintMessage" value="يوجد تحديث جديد للتطبيق، يرجى الانضمام للقناة لتحميل أحدث نسخة.">

            <label>رابط قناة التليجرام:</label>
            <input type="text" id="maintTelegram" value="https://t.me/ALGENERALFILES">

            <button onclick="saveMaintenance()">حفظ إعدادات الصيانة</button>
        </div>

        <div class="card">
            <h3 class="section-title">⚙️ إعدادات التطبيق (المسار والملف)</h3>
            <label>مسار الوجهة (Destination Path):</label>
            <input type="text" id="destPath" value="/sdcard/Android/data/com.dts.freefireth/files/">

            <label>اختر الملف من جهازك (سيتم أخذ اسم الملف فقط):</label>
            <input type="file" id="filePicker" onchange="updateFileName()">
            <input type="text" id="fileName" value="config.zip" readonly style="background: #111; color: #888;">

            <button onclick="saveSettings()">حفظ الإعدادات</button>
        </div>

        <div class="card">
            <h3 class="section-title">🔑 إنشاء الأكواد (فردي أو 50 كود دفعة واحدة)</h3>

            <label>اختر مدة سريعة:</label>
            <select id="durationPreset" onchange="applyPresetDuration()">
                <option value="1h">1 ساعة</option>
                <option value="3h">3 ساعات</option>
                <option value="1d">1 يوم</option>
                <option value="7d">أسبوع (7 أيام)</option>
                <option value="30d" selected>شهر (30 يوم)</option>
                <option value="custom">مدة مخصصة يدوياً</option>
            </select>

            <label>المدة (مثال: 1h، 3h، 1d، 7d، 30d):</label>
            <input type="text" id="duration" value="30d">

            <label>عدد الأجهزة (0 للجميع):</label>
            <input type="number" id="devices" value="1" min="0">

            <div class="row-2">
                <div>
                    <button onclick="createCode()">توليد كود واحد</button>
                </div>
                <div>
                    <button id="bulk50Btn" onclick="createBulkCodes(50)">توليد 50 كود دفعة واحدة ⚡</button>
                </div>
            </div>

            <div id="resultBox" style="display:none; background:#000; padding:15px; border-radius:8px; border:1px dashed var(--main-red); text-align:center; margin-top:10px;">
                <div id="generatedCode" style="font-size:22px; font-weight:bold; color:#fff; margin-bottom:10px;"></div>
                <button onclick="copyCode()" style="background:#333; margin:0;">نسخ الكود 📋</button>
            </div>

            <div id="bulkBox" class="bulk-box">
                <div id="bulkStatus" style="color:#00ff00; font-weight:bold; margin-bottom:8px;"></div>
                <div id="bulkCodesList" class="bulk-list"></div>
                <button onclick="copyBulkCodes()" style="background:#333; margin-bottom:0;">نسخ الـ 50 كود دفعة واحدة 📋</button>
            </div>
        </div>

        <div class="card">
            <h3 class="section-title">📋 إدارة الأكواد</h3>
            <button id="deleteAllBtn" class="btn-del-all" onclick="deleteAllCodes()">🗑️ حذف جميع الأكواد</button>
            <div id="codesList"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8TFOsvyZHCnIXQFZBFotdhLhFs6WoubQ",
            authDomain: "algeneral-95210.firebaseapp.com",
            projectId: "algeneral-95210",
            storageBucket: "algeneral-95210.firebasestorage.app",
            messagingSenderId: "666486704683",
            appId: "1:666486704683:web:d82a78527fa09fb036786e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let lastBulkCodes = [];

        window.checkLogin = function() {
            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;
            if (u === "ALGENERAL" && p === "morad") {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                loadMaintenance();
                loadSettings();
                loadCodes();
            } else {
                alert("بيانات الدخول غير صحيحة!");
            }
        };

        window.applyPresetDuration = function() {
            const preset = document.getElementById("durationPreset").value;
            const input = document.getElementById("duration");
            if (preset !== "custom") {
                input.value = preset;
            }
        };

        async function loadMaintenance() {
            const snap = await getDoc(doc(db, "settings", "maintenance"));
            if (snap.exists()) {
                const d = snap.data();
                document.getElementById("maintEnabled").value = d.enabled ? "true" : "false";
                if (d.message) document.getElementById("maintMessage").value = d.message;
                if (d.telegramUrl) document.getElementById("maintTelegram").value = d.telegramUrl;
            }
        }

        window.saveMaintenance = async function() {
            const enabled = document.getElementById("maintEnabled").value === "true";
            const message = document.getElementById("maintMessage").value.trim() || "التطبيق تحت الصيانة حالياً.";
            const telegramUrl = document.getElementById("maintTelegram").value.trim() || "https://t.me/ALGENERALFILES";

            await setDoc(doc(db, "settings", "maintenance"), {
                enabled: enabled,
                message: message,
                telegramUrl: telegramUrl,
                updatedAt: new Date().toISOString()
            });
            alert(enabled ? "تم تفعيل وضع الصيانة وإيقاف التطبيق!" : "تم إلغاء وضع الصيانة وتشغيل التطبيق!");
        };

        window.updateFileName = function() {
            const file = document.getElementById("filePicker").files[0];
            if (file) document.getElementById("fileName").value = file.name;
        };

        async function loadSettings() {
            const docSnap = await getDoc(doc(db, "settings", "config"));
            if (docSnap.exists()) {
                if (docSnap.data().path) document.getElementById("destPath").value = docSnap.data().path;
                if (docSnap.data().file_name) document.getElementById("fileName").value = docSnap.data().file_name;
            }
        }

        window.saveSettings = async function() {
            await setDoc(doc(db, "settings", "config"), {
                path: document.getElementById("destPath").value,
                file_name: document.getElementById("fileName").value
            });
            alert("تم حفظ الإعدادات بنجاح!");
        };

        function parseDuration(durationInput) {
            const match = durationInput.trim().match(/^(\d+)([mhd])?$/i);
            if (!match) return null;
            const amount = parseInt(match[1], 10);
            if (amount <= 0) return null;
            const unit = (match[2] || 'd').toLowerCase();

            if (unit === 'm') return { ms: amount * 60000, text: amount + " دقيقة" };
            if (unit === 'h') return { ms: amount * 3600000, text: amount + " ساعة" };
            if (amount === 7) return { ms: amount * 86400000, text: "أسبوع (7 أيام)" };
            if (amount === 30) return { ms: amount * 86400000, text: "شهر (30 يوم)" };
            return { ms: amount * 86400000, text: amount + " يوم" };
        }

        function generateRandomCode() {
            const p1 = Math.random().toString(36).substring(2, 6).toUpperCase();
            const p2 = Math.random().toString(36).substring(2, 6).toUpperCase();
            return `ALGENERAL-${p1}-${p2}`;
        }

        window.copySpecificCode = function(text) {
            navigator.clipboard.writeText(text);
            alert("تم نسخ الكود: " + text);
        };

        window.createCode = async function() {
            const parsed = parseDuration(document.getElementById("duration").value);
            if (!parsed) {
                alert("صيغة المدة غلط! استخدم 1h أو 3h أو 1d أو 7d أو 30d");
                return;
            }
            const devices = parseInt(document.getElementById("devices").value, 10) || 0;
            const expiresAt = new Date(Date.now() + parsed.ms).toISOString();
            const code = generateRandomCode();

            await setDoc(doc(db, "codes", code), {
                code: code,
                durationText: parsed.text,
                durationMs: parsed.ms,
                expiresAt: expiresAt,
                maxDevices: devices,
                usedDevices: [],
                status: "active",
                createdAt: new Date().toISOString()
            });

            document.getElementById("generatedCode").innerText = code;
            document.getElementById("resultBox").style.display = "block";
            loadCodes();
        };

        window.createBulkCodes = async function(count) {
            const parsed = parseDuration(document.getElementById("duration").value);
            if (!parsed) {
                alert("صيغة المدة غلط! استخدم 1h أو 3h أو 1d أو 7d أو 30d");
                return;
            }
            const btn = document.getElementById("bulk50Btn");
            btn.disabled = true;
            btn.innerText = "جاري توليد وحفظ 50 كود...";

            const devices = parseInt(document.getElementById("devices").value, 10) || 0;
            const createdAt = new Date().toISOString();
            const expiresAt = new Date(Date.now() + parsed.ms).toISOString();

            const generatedSet = new Set();
            while (generatedSet.size < count) {
                generatedSet.add(generateRandomCode());
            }

            const codesArray = Array.from(generatedSet);
            const batch = writeBatch(db);

            for (const c of codesArray) {
                const ref = doc(db, "codes", c);
                batch.set(ref, {
                    code: c,
                    durationText: parsed.text,
                    durationMs: parsed.ms,
                    expiresAt: expiresAt,
                    maxDevices: devices,
                    usedDevices: [],
                    status: "active",
                    createdAt: createdAt
                });
            }

            await batch.commit();
            lastBulkCodes = codesArray;

            document.getElementById("bulkStatus").innerText = `تم توليد وحفظ ${codesArray.length} كود (${parsed.text}) بنجاح!`;
            const listEl = document.getElementById("bulkCodesList");
            listEl.innerHTML = "";
            codesArray.forEach((c) => {
                const row = document.createElement("div");
                row.className = "bulk-row";
                row.innerHTML = `
                    <span class="code-txt">${c}</span>
                    <button class="copy-mini" onclick="copySpecificCode('${c}')">نسخ 📋</button>
                `;
                listEl.appendChild(row);
            });
            document.getElementById("bulkBox").style.display = "block";

            btn.disabled = false;
            btn.innerText = "توليد 50 كود دفعة واحدة ⚡";
            loadCodes();
        };

        window.copyCode = function() {
            navigator.clipboard.writeText(document.getElementById("generatedCode").innerText);
            alert("تم النسخ!");
        };

        window.copyBulkCodes = function() {
            if (!lastBulkCodes.length) return;
            navigator.clipboard.writeText(lastBulkCodes.join("\n"));
            alert("تم نسخ جميع الأكواد!");
        };

        async function loadCodes() {
            const list = document.getElementById("codesList");
            list.innerHTML = "جاري التحميل...";
            const querySnapshot = await getDocs(collection(db, "codes"));
            list.innerHTML = "";

            if (querySnapshot.empty) {
                list.innerHTML = "<p style='text-align:center;color:#888;'>لا توجد أكواد حالياً.</p>";
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const codeStr = data.code || docSnap.id;
                const isBanned = data.status !== "active";
                const isExpired = new Date(data.expiresAt) < new Date();
                const usedCount = Array.isArray(data.usedDevices) ? data.usedDevices.length : 0;
                const durMs = data.durationMs || 86400000;

                let statusText = "نشط";
                let statusClass = "status-active";
                if (isBanned) { statusText = "موقوف"; statusClass = "status-banned"; }
                else if (isExpired) { statusText = "منتهي"; statusClass = "status-banned"; }

                const div = document.createElement("div");
                div.className = "code-item";
                div.innerHTML = `
                    <div class="code-top">
                        <span class="code-txt">${codeStr}</span>
                        <button class="copy-mini" onclick="copySpecificCode('${codeStr}')">نسخ 📋</button>
                    </div>
                    <div class="code-info">
                        <span>الحالة: <span class="${statusClass}">${statusText}</span></span>
                        <span>المدة: ${data.durationText || "مخصص"}</span>
                    </div>
                    <div class="code-info">
                        <span>الاستخدام: ${usedCount}/${data.maxDevices ?? 0}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-renew" onclick="renewCode('${codeStr}', ${durMs})">🔄 تجديد</button>
                        <button class="btn-time" onclick="addTime('${codeStr}', '${data.expiresAt}')">+ ساعة</button>
                        <button class="btn-stop" onclick="toggleStatus('${codeStr}', '${data.status}')">${isBanned ? 'تفعيل' : 'إيقاف'}</button>
                        <button class="btn-del" onclick="deleteCode('${codeStr}')">حذف</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        window.renewCode = async function(code, durationMs) {
            const newExpiresAt = new Date(Date.now() + (durationMs || 86400000)).toISOString();
            await updateDoc(doc(db, "codes", code), {
                expiresAt: newExpiresAt,
                status: "active"
            });
            alert("تم تجديد وتفعيل الكود: " + code);
            loadCodes();
        };

        window.addTime = async function(code, currentExpiresAt) {
            const baseTime = Math.max(Date.now(), new Date(currentExpiresAt).getTime() || Date.now());
            const newDate = new Date(baseTime + 3600000);
            await updateDoc(doc(db, "codes", code), { expiresAt: newDate.toISOString(), status: "active" });
            loadCodes();
        };

        window.toggleStatus = async function(code, currentStatus) {
            await updateDoc(doc(db, "codes", code), { status: currentStatus === "active" ? "banned" : "active" });
            loadCodes();
        };

        window.deleteCode = async function(code) {
            if (confirm("هل أنت متأكد من حذف الكود " + code + "؟")) {
                await deleteDoc(doc(db, "codes", code));
                loadCodes();
            }
        };

        window.deleteAllCodes = async function() {
            if (!confirm("⚠️ تحذير: هل أنت متأكد من حذف جميع الأكواد نهائياً؟")) return;
            const btn = document.getElementById("deleteAllBtn");
            btn.disabled = true;
            btn.innerText = "جاري حذف جميع الأكواد...";

            const snap = await getDocs(collection(db, "codes"));
            const docs = snap.docs;

            // Firestore batch حد أقصى 500 عملية لكل batch
            for (let i = 0; i < docs.length; i += 450) {
                const batch = writeBatch(db);
                const chunk = docs.slice(i, i + 450);
                chunk.forEach((d) => batch.delete(d.ref));
                await batch.commit();
            }

            btn.disabled = false;
            btn.innerText = "🗑️ حذف جميع الأكواد";
            alert("تم حذف جميع الأكواد بنجاح!");
            loadCodes();
        };
    </script>
</body>
</html>
